[package]
name = "raydesk"
version = "0.2.0"
raylang = "1.27.14"

[native]
# Bake the frontend into the native binary / .app so it runs from any cwd
# (a bundled macOS .app launches with cwd=/). In dev (ray run / ray dev) these
# same files are read live from disk.
embed = ["assets"]

[dependencies]
web = "^0.4.5"
net = "^0.3.7"
