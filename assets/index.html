<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RayDesk</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <main class="app">
        <header class="topbar">
            <h1>RayDesk</h1>
            <p class="subtitle">Tareas de escritorio e iOS · raylang</p>
        </header>

        <form id="new-task" class="new-task" autocomplete="off">
            <input id="title" type="text" placeholder="Nueva tarea…" maxlength="200" required>
            <button type="submit">Añadir</button>
        </form>

        <section class="stats">
            <span id="stat-total">0 tareas</span>
            <span id="stat-done">0 completadas</span>
            <button id="clear-done" class="link" type="button">Limpiar completadas</button>
        </section>

        <ul id="list" class="list"></ul>

        <p id="empty" class="empty" hidden>No hay tareas todavía. Añade la primera arriba.</p>
    </main>

    <div id="about-overlay" class="overlay">
        <div class="about" role="dialog" aria-modal="true" aria-labelledby="about-title">
            <h2 id="about-title">RayDesk</h2>
            <p class="about-tagline">Gestor de tareas de escritorio e iOS</p>
            <dl class="about-meta">
                <div><dt>Versión</dt><dd>0.1.0</dd></div>
                <div><dt>Escrito en</dt><dd>raylang</dd></div>
                <div><dt>Creador</dt><dd>Rayala</dd></div>
            </dl>
            <button id="about-close" type="button">Cerrar</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
